  <text x="112" y="286" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14395a">y Priorización</text>

  <rect x="20" y="770" width="184" height="52" rx="10" fill="#e8f2fa" stroke="#15547f" stroke-width="1.5" />
  <text x="112" y="793" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14395a">Controles Zero Trust</text>
  <text x="112" y="811" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14395a">y Reglas de Calidad</text>

  <rect x="1036" y="245" width="184" height="52" rx="10" fill="#e8f2fa" stroke="#15547f" stroke-width="1.5" />
  <text x="1128" y="268" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14395a">Escalamiento de</text>
  <text x="1128" y="286" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#14395a">Conflictos y Riesgos</text>

  <rect x="1036" y="770" width="184" height="52" rx="10" fill="#e5f6e7" stroke="#2d8145" stroke-width="1.5" />
  <text x="1128" y="793" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d5330">KPIs de Calidad y</text>
  <text x="1128" y="811" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1d5330">Cumplimiento</text>
</svg>
