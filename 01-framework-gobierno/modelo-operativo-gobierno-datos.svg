<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1110" width="1240" height="1110">
  <defs>
    <style>
      .flow-down {
        stroke-dasharray: 10 6;
        animation: dashFlow 1.2s linear infinite;
      }
      .flow-up {
        stroke-dasharray: 10 6;
        animation: dashFlow 1.2s linear infinite;
      }
      .flow-center {
        stroke-dasharray: 8 5;
        animation: dashFlow 0.9s linear infinite;
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 32; }
        to { stroke-dashoffset: 0; }
      }
    </style>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#56517e" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#226aa1" />
    </marker>
    <marker id="arrow-darkblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15547f" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc901f" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2d8145" />
    </marker>
  </defs>

  <!-- Fondo blanco -->
  <rect x="0" y="0" width="1240" height="1110" fill="#ffffff" />

  <!-- ==================== FLUJOS ANIMADOS ==================== -->
  <!-- Centro descendente -->
  <path d="M 620 250 L 620 302" fill="none" stroke="#56517e" stroke-width="3.2" class="flow-center" marker-end="url(#arrow-purple)" />
  <path d="M 620 530 L 620 582" fill="none" stroke="#226aa1" stroke-width="3.2" class="flow-center" marker-end="url(#arrow-blue)" />
  <path d="M 620 820 L 620 872" fill="none" stroke="#dc901f" stroke-width="3.2" class="flow-center" marker-end="url(#arrow-amber)" />

  <!-- Izquierda descendente (Politicas y Zero Trust) -->
  <path d="M 240 140 L 120 140 Q 110 140 110 150 L 110 695 Q 110 705 120 705 L 232 705"
        fill="none" stroke="#2571a6" stroke-width="3" class="flow-down" marker-end="url(#arrow-blue)" />
  <path d="M 240 420 L 70 420 Q 60 420 60 430 L 60 970 Q 60 980 70 980 L 232 980"
        fill="none" stroke="#15547f" stroke-width="3" class="flow-down" marker-end="url(#arrow-darkblue)" />

  <!-- Derecha ascendente (KPIs y Escalamiento) -->
  <path d="M 1000 980 L 1120 980 Q 1130 980 1130 970 L 1130 430 Q 1130 420 1120 420 L 1008 420"
        fill="none" stroke="#2d8145" stroke-width="3" class="flow-up" marker-end="url(#arrow-green)" />
  <path d="M 1000 705 L 1170 705 Q 1180 705 1180 695 L 1180 150 Q 1180 140 1170 140 L 1008 140"
        fill="none" stroke="#15547f" stroke-width="3" class="flow-up" marker-end="url(#arrow-darkblue)" />

  <!-- ==================== NIVEL 1: ESTRATEGICO ==================== -->
  <rect x="240" y="30" width="760" height="220" rx="14" fill="#EAE7FF" stroke="#56517e" stroke-width="2" />
  <path d="M 254 30 H 986 A 14 14 0 0 1 1000 44 V 92 H 240 V 44 A 14 14 0 0 1 254 30 Z" fill="#76608a" stroke="#432D57" stroke-width="1" />
  <text x="266" y="57" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">1. Nivel Estratégico — Comité Ejecutivo de Datos</text>
  <text x="266" y="79" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#f0ecf7">Autoridad corporativa · Sesiones trimestrales · Alineación con ROI y Estrategia</text>

  <!-- Tarjetas Nivel 1 -->
  <rect x="266" y="112" width="218" height="116" rx="12" fill="#d0cee2" stroke="#56517e" stroke-width="1.8" />
  <text x="375" y="143" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#193f64">C-Level y Directores</text>
  <text x="375" y="167" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">Aprueba Política Corporativa,</text>
  <text x="375" y="185" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">inversión (ROI/TCO) y</text>
  <text x="375" y="203" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">presupuesto anual.</text>

  <rect x="511" y="112" width="218" height="116" rx="12" fill="#d0cee2" stroke="#56517e" stroke-width="1.8" />
  <text x="620" y="143" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#193f64">Priorización de Dominios</text>
  <text x="620" y="167" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">Define dominios críticos a</text>
  <text x="620" y="185" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">gobernar y aprueba la hoja</text>
  <text x="620" y="203" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">de ruta (90 días / Año 1).</text>

  <rect x="756" y="112" width="218" height="116" rx="12" fill="#d0cee2" stroke="#56517e" stroke-width="1.8" />
  <text x="865" y="143" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#193f64">Arbitraje Ejecutivo</text>
  <text x="865" y="167" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">Resuelve disputas de propiedad</text>
  <text x="865" y="185" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">y definiciones de negocio</text>
  <text x="865" y="203" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#243447">escaladas desde la operación.</text>

  <!-- ==================== NIVEL 2: TACTICO ==================== -->
  <rect x="240" y="310" width="760" height="220" rx="14" fill="#ecf7ff" stroke="#226aa1" stroke-width="2" />
  <path d="M 254 310 H 986 A 14 14 0 0 1 1000 324 V 372 H 240 V 324 A 14 14 0 0 1 254 310 Z" fill="#2379b0" stroke="#2379b0" stroke-width="1" />
  <text x="266" y="337" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">2. Nivel Táctico — Oficina de Gobierno de Datos (DGO)</text>
  <text x="266" y="359" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e6f4fd">Estándares DAMA-DMBOK · Arquitectura TOGAF · Auditoría y Habilitación</text>

  <!-- Tarjetas Nivel 2 -->
  <rect x="266" y="392" width="218" height="116" rx="12" fill="#D6ECFC" stroke="#23669B" stroke-width="1.8" />
  <text x="375" y="423" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14395a">Dirección de Gobierno (CDO)</text>
  <text x="375" y="447" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">Diseña políticas, capacita</text>
  <text x="375" y="465" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">roles y certifica datasets</text>
  <text x="375" y="483" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">para Analítica e IA.</text>

  <rect x="511" y="392" width="218" height="116" rx="12" fill="#D6ECFC" stroke="#23669B" stroke-width="1.8" />
  <text x="620" y="423" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14395a">Arquitectura de Información</text>
  <text x="620" y="447" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">Gobierna Data Fabric, catálogo</text>
  <text x="620" y="465" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">de metadatos, linaje end-to-end</text>
  <text x="620" y="483" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">y control de deuda técnica.</text>

  <rect x="756" y="392" width="218" height="116" rx="12" fill="#D6ECFC" stroke="#23669B" stroke-width="1.8" />
  <text x="865" y="423" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#14395a">Seguridad y Cumplimiento</text>
  <text x="865" y="447" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">Aplica controles Zero Trust,</text>
  <text x="865" y="465" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">protección PII, retención</text>
  <text x="865" y="483" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#1c3b57">y recertificación de accesos.</text>

  <!-- ==================== NIVEL 3: OPERATIVO ==================== -->
  <rect x="240" y="590" width="760" height="230" rx="14" fill="#fff9eb" stroke="#dc901f" stroke-width="2" />
  <path d="M 254 590 H 986 A 14 14 0 0 1 1000 604 V 652 H 240 V 604 A 14 14 0 0 1 254 590 Z" fill="#dd941d" stroke="#dd941d" stroke-width="1" />
  <text x="266" y="617" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">3. Nivel Operativo — Consejos de Dominio</text>
  <text x="266" y="639" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#fff6e5">Dominios: Clientes · Productos · Finanzas · Riesgos · Operaciones</text>

  <!-- Tarjetas Nivel 3 -->
  <rect x="266" y="672" width="218" height="126" rx="12" fill="#fff2cf" stroke="#d99423" stroke-width="1.8" />
  <text x="375" y="704" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#633b0b">Data Owner (Negocio)</text>
  <text x="375" y="730" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12"><tspan font-weight="700">[A]</tspan> Dueño de semántica, CDEs,</text>
  <text x="375" y="749" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12">reglas MDM, clasificación PII</text>
  <text x="375" y="768" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12">y aprobación de accesos.</text>

  <rect x="511" y="672" width="218" height="126" rx="12" fill="#fff2cf" stroke="#d99423" stroke-width="1.8" />
  <text x="620" y="704" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#633b0b">Data Steward (Táctico)</text>
  <text x="620" y="730" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12"><tspan font-weight="700">[R]</tspan> Opera glosario de negocio,</text>
  <text x="620" y="749" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12">certifica calidad, gestiona</text>
  <text x="620" y="768" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12">Golden Record y remediación.</text>

  <rect x="756" y="672" width="218" height="126" rx="12" fill="#fff2cf" stroke="#d99423" stroke-width="1.8" />
  <text x="865" y="704" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#633b0b">Data Custodian (TI / Ing.)</text>
  <text x="865" y="730" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12"><tspan font-weight="700">[R]</tspan> Custodia infraestructura,</text>
  <text x="865" y="749" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12">automatiza reglas en pipelines</text>
  <text x="865" y="768" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" fill="#5c3d12">y ejecuta seguridad técnica.</text>

  <!-- ==================== NIVEL 4: ZERO TRUST Y METAS ==================== -->
  <rect x="240" y="880" width="760" height="200" rx="14" fill="#effaf0" stroke="#32884c" stroke-width="2" />
  <path d="M 254 880 H 986 A 14 14 0 0 1 1000 894 V 936 H 240 V 894 A 14 14 0 0 1 254 880 Z" fill="#39914f" stroke="#39914f" stroke-width="1" />
  <text x="266" y="915" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">4. Clasificación Zero Trust y Metas de Impacto (Año 1)</text>

  <!-- 4 Tarjetas Base -->
  <rect x="262" y="954" width="168" height="106" rx="12" fill="#e5f6e7" stroke="#339454" stroke-width="1.8" />
  <text x="346" y="982" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1d5330">Seguridad por Nivel</text>
  <text x="346" y="1003" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">Pública · Interna</text>
  <text x="346" y="1020" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">Confidencial · PII</text>
  <text x="346" y="1040" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d5330">100% recertificación</text>

  <rect x="444" y="954" width="168" height="106" rx="12" fill="#e5f6e7" stroke="#339454" stroke-width="1.8" />
  <text x="528" y="982" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1d5330">Calidad en CDE</text>
  <text x="528" y="1003" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">Completitud, Exactitud</text>
  <text x="528" y="1020" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">y Consistencia</text>
  <text x="528" y="1040" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d5330">Meta: ≥ 98%</text>

  <rect x="626" y="954" width="168" height="106" rx="12" fill="#e5f6e7" stroke="#339454" stroke-width="1.8" />
  <text x="710" y="982" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1d5330">Linaje y MTTR</text>
  <text x="710" y="1003" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">Trazabilidad End-to-End:</text>
  <text x="710" y="1020" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d5330">≥ 85%</text>
  <text x="710" y="1040" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">Remediación: <tspan font-weight="700">&lt; 24h</tspan></text>

  <rect x="808" y="954" width="168" height="106" rx="12" fill="#e5f6e7" stroke="#339454" stroke-width="1.8" />
  <text x="892" y="982" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1d5330">Adopción BI e IA</text>
  <text x="892" y="1003" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">Consumo sobre activos</text>
  <text x="892" y="1020" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#214e31">certificados y MDM</text>
  <text x="892" y="1040" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1d5330">Meta: ≥ 80%</text>

  <!-- ==================== ETIQUETAS DE FLUJOS (PILLS) ==================== -->
  <rect x="20" y="245" width="184" height="52" rx="10" fill="#e8f2fa" stroke="#2571a6" stroke-width="1.5" />
